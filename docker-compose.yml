

services:

  # ─── MongoDB ───────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: shopgame_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=shopgame
    volumes:
      - mongo_data:/data/db
    networks:
      - shopgame_net

  # ─── mongo express ──────────────────────
  mongo-express:
    image: mongo-express
    container_name: shopgame_mongo_express
    restart: always
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - shopgame_net

  # ─── Backend (Node + Express) ──────────────────────
  backend:
    build: ./backend
    container_name: shopgame_backend
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/shopgame
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=shopgame_jwt_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - shopgame_net

  # ─── Frontend (React) ──────────────────────────────
  frontend:
    build: ./frontend
    container_name: shopgame_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - shopgame_net

  # ─── Nginx (Reverse Proxy) ─────────────────────────
  nginx:
    build: ./nginx
    container_name: shopgame_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - shopgame_net

volumes:
  mongo_data:

networks:
  shopgame_net:
    driver: bridge